<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Holiday Traffic Tracker{% block title %}{% endblock %}</title>
    <link
      type="text/css"
      rel="stylesheet"
      href="{{ url_for('static',
    filename='styles.css') }}"
    />
    {% block styles %}{% endblock %} 

    <link
      type="text/css"
      rel="stylesheet"
      href="{{ url_for('static',
    filename='node_modules/bootstrap/dist/css/bootstrap.min.css') }}"
    />
    <link
      type="text/css"
      rel="stylesheet"
      href="{{ url_for('static',
    filename='node_modules/leaflet/dist/leaflet.css') }}"
    />

  </head>
  <body>
    <nav class="navbar navbar-expand-lg lb-bg">
      <div class="container-fluid">
        <a class="navbar-brand" id="home-link" href="/"
          >Holiday Traffic Tracker</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" id="pathfinding-link" href="/pathfinding"
                >Pathfinder</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" id="statistics-link" href="/statistics"
                >Statistics</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" id="responses-link" href="/responses"
                >Responses</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <main class="container-fluid">{% block content %} {% endblock %}</main>
    <script src="{{ url_for('static',
    filename='node_modules/bootstrap/dist/js/bootstrap.min.js') }}"></script>
    <script src="{{ url_for('static',
    filename='node_modules/plotly.js-dist/plotly.js') }}"></script>
    <script src="{{ url_for('static',
    filename='node_modules/leaflet/dist/leaflet.js') }}"></script>
    <script src="{{ url_for('static',
    filename='node_modules/heatmap.js/build/heatmap.min.js') }}"></script>
    <script src="{{ url_for('static',
    filename='node_modules/heatmap.js/plugins/leaflet-heatmap/leaflet-heatmap.js') }}"></script>
    
    {% block scripts %}{% endblock %} 
  </body>
</html>
